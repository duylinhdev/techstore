<div class="breadcrumbs-section plr-200 mb-80 section" th:fragment="breadcrumb(title, pageName)">
    <div class="breadcrumbs overlay-bg">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumbs-inner">
                        <h1 class="breadcrumbs-title" th:text="${title}"></h1>
                        <ul class="breadcrumb-list">
                            <li>
                                <a th:href="@{/}">Trang chủ</a>
                            </li>
                            <li th:text="${pageName}"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
