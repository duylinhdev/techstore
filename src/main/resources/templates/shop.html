<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sản phẩm</title>
    <th:block th:replace="~{common/header}"></th:block>
</head>

<body>
<div class="wrapper">
    <th:block th:replace="~{common/menu}"></th:block>
    <th:block th:replace="~{common/breadcrumb :: breadcrumb('SẢN PHẨM', 'SẢN PHẨM')}"></th:block>

    <!-- Start page content -->
    <div id="page-content" class="page-wrapper section">
        <!-- SHOP SECTION START -->
        <div class="shop-section mb-80">
            <div class="container">
                <div class="row">
                    <!-- Main content -->
                    <div class="col-lg-9 order-lg-2 order-1">
                        <div class="shop-content">
                            <!-- shop-option start -->
                            <div class="shop-option box-shadow mb-30 clearfix">
                                <div class="shop-option box-shadow mb-30 p-3 bg-white rounded-3 d-flex align-items-center justify-content-between flex-wrap gap-3">
                                    <div class="d-flex align-items-center gap-2 flex-wrap">
                                        <span>Sort by:</span>

                                        <a th:href="@{/san-pham(
                                                categorySlugs=${filter.categorySlugs},
                                                brandSlugs=${filter.brandSlugs},
                                                keyword=${filter.keyword},
                                                minPrice=${filter.minPrice},
                                                maxPrice=${filter.maxPrice},
                                                sortBy='id',
                                                sortOrder='desc'
                                            )}"
                                                class="btn btn-sm px-3 py-2 rounded fw-medium d-flex align-items-center justify-content-center text-decoration-none"
                                                th:style="${sortBy == 'id' and sortOrder == 'desc'}
                                               ? 'background-color: #ff6a00 !important; color: white !important; border: 1px solid #ff6a00;'
                                               : 'background-color: #f8f9fa; color: #444; border: 1px solid #dee2e6;'">
                                            Mới nhất
                                        </a>

                                        <div class="dropdown">
                                            <button class="btn btn-sm px-3 py-2 rounded fw-medium dropdown-toggle d-flex align-items-center justify-content-center gap-1"
                                                    type="button"
                                                    data-bs-toggle="dropdown"
                                                    aria-expanded="false"
                                                    th:style="${sortBy == 'price'}
                                                        ? 'background-color: #ff6a00 !important; color: white !important; border: 1px solid #ff6a00;'
                                                        : 'background-color: #f8f9fa; color: #444; border: 1px solid #dee2e6;'">
                                                <span th:text="${sortBy == 'price'
                                                    ? (sortOrder == 'asc' ? 'Giá: Thấp đến cao' : 'Giá: Cao đến thấp')
                                                    : 'Giá'}">
                                                    Giá
                                                </span>
                                            </button>

                                            <ul class="dropdown-menu shadow border-0 py-2" style="font-size: 13px">
                                                <li>
                                                    <a class="dropdown-item py-2 px-3 text-dark"
                                                            th:href="@{/san-pham(
                                                            categorySlugs=${filter.categorySlugs},
                                                            brandSlugs=${filter.brandSlugs},
                                                            keyword=${filter.keyword},
                                                            minPrice=${filter.minPrice},
                                                            maxPrice=${filter.maxPrice},
                                                            sortBy='price',
                                                            sortOrder='asc'
                                                        )}"
                                                            th:style="${sortBy == 'price' and sortOrder == 'asc'}
                                                           ? 'background-color: #fff3ed; color: #ff6a00 !important; font-weight: bold;'
                                                           : ''">
                                                        <i class="zmdi zmdi-long-arrow-up me-1 text-muted"></i>
                                                        Giá: Thấp đến cao
                                                    </a>
                                                </li>
                                                <li>
                                                    <a class="dropdown-item py-2 px-3 text-dark"
                                                            th:href="@{/san-pham(
                                                            categorySlugs=${filter.categorySlugs},
                                                            brandSlugs=${filter.brandSlugs},
                                                            keyword=${filter.keyword},
                                                            minPrice=${filter.minPrice},
                                                            maxPrice=${filter.maxPrice},
                                                            sortBy='price',
                                                            sortOrder='desc'
                                                        )}"
                                                            th:style="${sortBy == 'price' and sortOrder == 'desc'}
                                                           ? 'background-color: #fff3ed; color: #ff6a00 !important; font-weight: bold;'
                                                           : ''">
                                                        <i class="zmdi zmdi-long-arrow-down me-1 text-muted"></i>
                                                        Giá: Cao đến thấp
                                                    </a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- shop-option end -->

                            <!-- Tab Content start -->
                            <div class="tab-content">
                                <div id="grid-view" class="tab-pane active show" role="tabpanel">
                                    <div class="row">
                                        <!-- product-item start -->
                                        <div th:each="product : ${result.list}"
                                                class="col-lg-3 col-md-6 col-12">
                                            <div class="product-item">
                                                <div class="product-img">
                                                    <a th:href="@{/san-pham/{slug}(slug=${product.slug})}">
                                                        <img th:src="${product.mainImageUrl}"
                                                                th:alt="${product.name}"/>
                                                    </a>
                                                </div>
                                                <div class="product-info">
                                                    <h6 class="product-title">
                                                        <a th:href="@{/san-pham/{slug}(slug=${product.slug})}"
                                                                th:text="${product.name}">
                                                            Product Name
                                                        </a>
                                                    </h6>
                                                    <div class="pro-rating">
                                                        <a href="#"><i class="zmdi zmdi-star"></i></a>
                                                        <a href="#"><i class="zmdi zmdi-star"></i></a>
                                                        <a href="#"><i class="zmdi zmdi-star"></i></a>
                                                        <a href="#"><i class="zmdi zmdi-star-half"></i></a>
                                                        <a href="#"><i class="zmdi zmdi-star-outline"></i></a>
                                                    </div>
                                                    <h3 class="pro-price"
                                                            th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'">
                                                        Giá
                                                    </h3>
                                                    <ul class="action-button">
                                                        <li>
                                                            <a href="#" title="Wishlist">
                                                                <i class="zmdi zmdi-favorite"></i>
                                                            </a>
                                                        </li>
                                                        <li>
                                                            <a href="#"
                                                                    data-bs-toggle="modal"
                                                                    data-bs-target="#productModal"
                                                                    title="Quickview">
                                                                <i class="zmdi zmdi-zoom-in"></i>
                                                            </a>
                                                        </li>
                                                        <li>
                                                            <a href="#" title="Compare">
                                                                <i class="zmdi zmdi-refresh"></i>
                                                            </a>
                                                        </li>
                                                        <li>
                                                            <a href="#" title="Add to cart">
                                                                <i class="zmdi zmdi-shopping-cart-plus"></i>
                                                            </a>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- product-item end -->
                                    </div>
                                </div>
                            </div>
                            <!-- Tab Content end -->

                            <!-- shop-pagination start -->
                            <ul class="shop-pagination box-shadow text-center ptblr-10-30"
                                    th:if="${result.totalPages > 1}">
                                <li th:classappend="${result.currentPage == 1} ? 'disable'">
                                    <a th:href="@{/san-pham(
                                            brandSlugs=${filter.brandSlugs},
                                            categorySlugs=${filter.categorySlugs},
                                            keyword=${filter.keyword},
                                            minPrice=${filter.minPrice},
                                            maxPrice=${filter.maxPrice},
                                            page=${result.currentPage - 1},
                                            sortBy=${sortBy},
                                            sortOrder=${sortOrder}
                                        )}">
                                        <i class="zmdi zmdi-chevron-left"></i>
                                    </a>
                                </li>

                                <th:block th:each="p : ${result.navigationPages}">
                                    <li th:if="${p != -1}"
                                            th:classappend="${p == result.currentPage} ? 'active'">
                                        <a th:href="@{/san-pham(
                                                brandSlugs=${filter.brandSlugs},
                                                categorySlugs=${filter.categorySlugs},
                                                keyword=${filter.keyword},
                                                minPrice=${filter.minPrice},
                                                maxPrice=${filter.maxPrice},
                                                page=${p},
                                                sortBy=${sortBy},
                                                sortOrder=${sortOrder}
                                            )}"
                                                th:text="${p}">
                                            01
                                        </a>
                                    </li>
                                    <li th:if="${p == -1}">
                                        <a href="javascript:void(0)">...</a>
                                    </li>
                                </th:block>

                                <li th:classappend="${result.currentPage == result.totalPages} ? 'disabled'">
                                    <a th:href="@{/san-pham(
                                            brandSlugs=${filter.brandSlugs},
                                            categorySlugs=${filter.categorySlugs},
                                            keyword=${filter.keyword},
                                            minPrice=${filter.minPrice},
                                            maxPrice=${filter.maxPrice},
                                            page=${result.currentPage + 1},
                                            sortBy=${sortBy},
                                            sortOrder=${sortOrder}
                                        )}">
                                        <i class="zmdi zmdi-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                            <!-- shop-pagination end -->
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <div class="col-lg-3 order-lg-1 order-2">
                        <!-- widget-categories -->
                        <aside class="widget widget-categories box-shadow mb-30">
                            <h6 class="widget-title border-left mb-20">Danh mục</h6>
                            <div id="cat-treeview" class="product-cat">
                                <ul>
                                    <li th:each="cat : ${categories}">
                                        <a th:href="@{/san-pham(
                                                categorySlugs=${cat.slug},
                                                keyword=${filter.keyword}
                                            )}"
                                                th:text="${cat.name}"
                                                th:style="${filter.categorySlugs != null and filter.categorySlugs.contains(cat.slug)
                                               ? 'font-weight: bold; color: #ff6a00'
                                               : ''}">
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </aside>

                        <!-- Thương hiệu -->
                        <aside class="widget widget-categories box-shadow mb-30"
                                th:if="${brands != null and !brands.isEmpty()}">
                            <h6 class="widget-title border-left mb-20">Thương hiệu</h6>
                            <div class="product-cat">
                                <form th:action="@{/san-pham}" method="get" id="brandFilterForm">
                                    <input type="hidden"
                                            name="categorySlugs"
                                            th:if="${filter.categorySlugs != null}"
                                            th:each="catSlug : ${filter.categorySlugs}"
                                            th:value="${catSlug}"/>
                                    <input type="hidden"
                                            name="keyword"
                                            th:if="${filter.keyword != null}"
                                            th:value="${filter.keyword}"/>
                                    <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                                    <input type="hidden" name="sortOrder" th:value="${sortOrder}"/>

                                    <ul>
                                        <li th:each="brand : ${brands}" style="margin-bottom: 8px">
                                            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: normal;">
                                                <input type="checkbox"
                                                        name="brandSlugs"
                                                        th:value="${brand.slug}"
                                                        th:checked="${filter.brandSlugs != null and filter.brandSlugs.contains(brand.slug)}"
                                                        onchange="document.getElementById('brandFilterForm').submit()"/>
                                                <span th:text="${brand.name}"></span>
                                            </label>
                                        </li>
                                    </ul>
                                </form>
                            </div>
                        </aside>

                        <!-- shop-filter (Price) -->
                        <aside class="widget shop-filter box-shadow mb-30">
                            <h6 class="widget-title border-left mb-20">Price</h6>
                            <div class="price_filter">
                                <form th:action="@{/san-pham}" method="get" id="priceFilterForm">
                                    <input type="hidden"
                                            name="categorySlugs"
                                            th:if="${filter.categorySlugs != null}"
                                            th:each="catSlug : ${filter.categorySlugs}"
                                            th:value="${catSlug}"/>
                                    <input type="hidden"
                                            name="brandSlugs"
                                            th:if="${filter.brandSlugs != null}"
                                            th:each="bSlug : ${filter.brandSlugs}"
                                            th:value="${bSlug}"/>
                                    <input type="hidden"
                                            name="keyword"
                                            th:if="${filter.keyword != null}"
                                            th:value="${filter.keyword}"/>
                                    <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                                    <input type="hidden" name="sortOrder" th:value="${sortOrder}"/>

                                    <div class="price_slider_amount mb-3">
                                        <div class="d-flex align-items-center gap-2">
                                            <input type="number"
                                                    name="minPrice"
                                                    th:value="${filter.minPrice}"
                                                    placeholder="Từ (đ)"
                                                    class="form-control form-control-lg"/>
                                            <span>-</span>
                                            <input type="number"
                                                    name="maxPrice"
                                                    th:value="${filter.maxPrice}"
                                                    placeholder="Đến (đ)"
                                                    class="form-control form-control-lg"/>
                                        </div>
                                    </div>
                                    <button type="submit" class="submit-btn-1 w-100 mt-30 btn-hover-1">
                                        Áp dụng giá
                                    </button>
                                </form>
                            </div>
                        </aside>
                    </div>
                </div>
            </div>
        </div>
        <!-- SHOP SECTION END -->
    </div>
    <!-- End page content -->

    <th:block th:replace="~{common/footer}"></th:block>
</div>

<!-- Scripts -->
<th:block th:replace="~{common/scripts}"></th:block>
</body>
</html>
